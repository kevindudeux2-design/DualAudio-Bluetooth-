name: Build DualAudio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verifier Gradle
        run: gradle --version

      - name: Decompresser le projet
        run: unzip -o DualAudio-Android-v0.3.2.zip

      - name: Compiler APK
        run: |
          cd DualAudio
          gradle assembleDebug --stacktrace

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudio-APK
          path: DualAudio/app/build/outputs/apk/debug/app-debug.apk
