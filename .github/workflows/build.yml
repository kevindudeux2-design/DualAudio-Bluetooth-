name: Build DualAudio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decompresser le projet
        run: .DualAudio-Android-v0.3.1.zip
      - name: Compiler l APK
        run: |
          cd DualAudio
          gradle assembleDebug

      - name: Recuperer l APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudio-APK
          path: DualAudio/app/build/outputs/apk/debug/app-debug.apk
